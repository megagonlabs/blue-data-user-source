[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-user-cli"
version = "0.1.0"
authors = [
    {name = "Eser Kandogan", email = "eser@megagon.ai"},
]
maintainers = [
    {name = "Eser Kandogan", email = "eser@megagon.ai"},
]
requires-python = ">=3.10,<3.15"
dependencies = [
    "blue-data-user-source>=0.1.0",
    "arrow>=1.3",
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
blue-userdb = "blue_data_user_cli.commands:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--tb=short -q"
pythonpath = ["src", "../../lib/src"]
testpaths = ["tests/unit"]
