[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-user-mcp"
version = "0.1.0"
description = "MCP server exposing UserSource operations to LLM clients"
requires-python = ">=3.10"
dependencies = [
    "blue-data-user-source>=0.1.0",
    "mcp[cli]>=1.0.0,<2.0.0",
]

[project.scripts]
udb-mcp = "blue_data_user_mcp.server:main"

[project.optional-dependencies]
dev   = ["pytest", "pytest-asyncio"]
redis = ["redis>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "../../lib/src"]
