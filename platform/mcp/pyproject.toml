[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-user-mcp"
version = "1.0.0"
authors = [
    {name = "Eser Kandogan", email = "eser@megagon.ai"},
]
maintainers = [
    {name = "Eser Kandogan", email = "eser@megagon.ai"},
]
description = "MCP server exposing UserSource operations to LLM clients"
requires-python = ">=3.12,<3.14"
dependencies = [
    "blue-data-user-source>=1.0,<2",
    "mcp[cli]>=1.28.1,<2",
]

[project.scripts]
blue-userdb-mcp = "blue_data_user_mcp.server:main"

[project.optional-dependencies]
dev   = ["pytest", "pytest-asyncio"]
redis = ["redis>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "../../lib/src"]
