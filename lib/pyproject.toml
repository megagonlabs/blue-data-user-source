[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-user-source"
version = "1.0.0"
authors = [
    {name = "Eser Kandogan", email = "eser@megagon.ai"},
]
maintainers = [
    {name = "Eser Kandogan", email = "eser@megagon.ai"},
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "blue-data>=1.0,<2",
    "blue-data-kb-source>=1.0,<2",
    "blue-data-doc-source>=1.0,<2",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
webhook = [
    "httpx>=0.27",
]
email = [
    "aiosmtplib>=3.0",
]
# The LangGraph demos in examples/framework-demos/ (#181).
examples = [
    "langgraph",
    "langchain-openai",
    "langchain-mcp-adapters",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-recording",
    "pytest-cov",
    "ruff",
    "pyright",
    "build",
    "twine",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The schemas are loaded at runtime from beside the code (source.py,
# interaction/contact.py); without this a wheel installs none of them (#162,
# #163). schema.txt, the readable source of schema.json, ships with them.
"blue_data_user_source" = ["py.typed"]
"blue_data_user_source.data" = ["*.json", "*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing"
pythonpath = ["src", "."]
testpaths = ["tests/unit"]

[tool.coverage.run]
source = ["src"]
