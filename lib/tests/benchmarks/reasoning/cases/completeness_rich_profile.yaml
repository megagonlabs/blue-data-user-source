id: completeness_rich_profile
benchmark_type: completeness
description: >
  Rich provenance — multiple extraction snippets covering skills, experience,
  and preferences. CompletenessMetric should score high (>= 0.7) because
  the results and provenance together provide sufficient detail.
query: "What are the user's technical skills and work preferences?"
results:
  - "Python, TypeScript, SQL, Kubernetes"
  - "Prefers remote work and async communication"
provenance:
  - extraction: "Alice is proficient in Python, TypeScript, SQL, and Kubernetes."
    source: "linkedin_bio.txt"
  - extraction: "Alice strongly prefers remote work and asynchronous communication."
    source: "work_preferences.txt"
  - extraction: "Alice has 6 years of experience in backend engineering."
    source: "resume.txt"
